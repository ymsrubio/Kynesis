<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kynesis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section class="feed" aria-label="Camera feed">
        <div class="stage">
          <video id="feed" autoplay muted playsinline></video>
          <div class="guide" aria-hidden="true"></div>
        </div>
        <p id="status" role="status">Starting…</p>
      </section>
      <aside>
      <section class="calibration" aria-label="Calibration">
        <h2>Calibration</h2>
        <p id="calibration-prompt" role="status">Hold your cube inside the guide, then start calibration.</p>
        <button id="calibrate" type="button">Start calibration</button>
        <ul class="swatches">
          <li data-face="U"><span>U</span></li>
          <li data-face="F"><span>F</span></li>
          <li data-face="R"><span>R</span></li>
          <li data-face="B"><span>B</span></li>
          <li data-face="L"><span>L</span></li>
          <li data-face="D"><span>D</span></li>
        </ul>
      </section>
      <section class="move-log" aria-label="Move log">
        <h2>Move log</h2>
        <ol id="moves" data-testid="move-log"></ol>
        <p id="moves-empty" class="empty">No moves yet</p>
      </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
